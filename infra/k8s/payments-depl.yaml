apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: krishu2814/payments
          env:
            - name: NATS_URL
              value: nats://nats-srv:4222
            - name: MONGO_URI
              value: mongodb://payments-mongo-cluster-srv:27017/payments
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET_KEY
            - name: STRIPE_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: STRIPE_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: payments-cluster-srv
spec:
  selector:
    app: payments
  ports:
    - name: payments-cluster-srv
      protocol: TCP
      port: 3000
      targetPort: 3000
